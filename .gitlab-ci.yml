# Minimal quality gate: lint + build + tests on every push.
# A runner with docker/Node 22 is required (self-hosted GitLab usually has one).

default:
  interruptible: true

stages:
  - check

check:
  stage: check
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
    - npm test
