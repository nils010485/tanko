# Minimal quality gate: lint + build + tests on every push.
# A runner with docker/Node 22 is required (self-hosted GitLab usually has one).

default:
  interruptible: true

stages:
  - check
  - image

check:
  stage: check
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
    - npm run typecheck
    - npm test

# --- Image OCI sur le registry interne : kaniko (pas de daemon, pas de privilège)
# INTERNAL_CA = variable CI de type « fichier » portant le root CA interne (TLS du registry).
# `latest` n'est poussé QUE sur un tag git : c'est la référence que suivent les
# serveurs, donc un commit sur main ne déploie jamais rien.
# needs: [] => l'image se construit dès le départ, sans attendre les tests.
# APP_VERSION : la version affichée par l'app vient de son manifeste ; on y
# injecte le tag git pour qu'elle corresponde à la release déployée.
image:oci:
  stage: image
  needs: []
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    DOCKERFILE: Dockerfile
    BUILD_CONTEXT: "."
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        IMAGE_TAGS: "$CI_COMMIT_TAG latest"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        IMAGE_TAGS: "$CI_COMMIT_SHORT_SHA"
  script:
    - |
      mkdir -p /kaniko/.docker
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > /kaniko/.docker/config.json
    - |
      VER="${APP_VERSION:-$CI_COMMIT_TAG}"
      VER="${VER#v}"
      set -- --context "$BUILD_CONTEXT" --dockerfile "$DOCKERFILE" \
             --registry-certificate "$CI_REGISTRY=$INTERNAL_CA" \
             --cache=true --cache-repo "$CI_REGISTRY_IMAGE/cache" \
             --label "org.opencontainers.image.title=$CI_PROJECT_NAME" \
             --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
             --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      if [ -n "$VER" ]; then set -- "$@" --build-arg "APP_VERSION=$VER"; fi
      for tag in $IMAGE_TAGS; do set -- "$@" --destination "$CI_REGISTRY_IMAGE:$tag"; done
      /kaniko/executor "$@"
